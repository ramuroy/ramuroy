name: Metrics

on:
  # refresh once a day
  schedule:
    - cron: "30 0 * * *"
  # allow manual runs from the Actions tab
  workflow_dispatch:
  # NOTE: intentionally NO "push" trigger — metrics commits its SVG to main with
  # the PAT, which would re-trigger a push-based run and loop forever.

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ramuroy
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata

          # language breakdown
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8

          # isometric 3D contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # lines of code changed across repos (reliable; replaces flaky habits plugin)
          plugin_lines: yes
          plugin_lines_sections: base
